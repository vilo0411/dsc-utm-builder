<!doctype html>
<html lang="vi">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
<div class="cat">
  <nav class="cat-nav" id="catNav" aria-label="Danh mục"></nav>
  <section class="card cat-main" id="main"></section>
</div>

<script src="assets/data.js"></script>
<script src="assets/config.js"></script>
<script src="assets/common.js"></script>
<script>
// Wait for the shared catalog (Supabase) before reading it
DSC.ready().then(function () {
  "use strict";
  const { $, el, slug, PLATFORMS, PLATFORM_ORDER, POS, clone } = DSC;
  DSC.renderNav("catalog");
  let D = DSC.loadData();

  const SCHEMA = {
    accounts: { title: "Kênh / tài khoản", desc: "Mỗi dòng là một tài khoản đăng link. utm_medium là mã định danh, đã dùng thì không đổi.",
      key: r => `${r.s}|${r.m}`, blank: () => ({ p: "facebook", s: "facebook", m: "", name: "", sub: "", owner: "", pos: [""] }),
      cols: [
        { k: "p", label: "Nền tảng", type: "select", options: () => PLATFORM_ORDER.filter(p => p !== "other").map(p => [p, PLATFORMS[p].name]) },
        { k: "s", label: "utm_source", type: "code" },
        { k: "m", label: "utm_medium", type: "code" },
        { k: "name", label: "Tên hiển thị" },
        { k: "sub", label: "Mô tả ngắn" },
        { k: "owner", label: "Team quản lý", list: () => [...new Set(D.accounts.map(a => a.owner).filter(Boolean))] },
        { k: "focus", label: "Định vị nội dung", wide: true },
        { k: "to", label: "Trang đích cho video / tin", type: "multi", options: () => DSC.activeLandings(D).map(l => [l.id, DSC.landingLabel(l)]) },
        { k: "mode", label: "Cách gửi link", type: "select", options: () => [["", "Theo video / tin"], ["script", "Theo kịch bản"]] },
        { k: "script", label: "Kịch bản (nếu có)", wide: true },
        { k: "pos", label: "Vị trí cho phép", type: "pos" },
        { k: "paid", label: "Trả tiền", type: "bool" },
        { k: "inactive", label: "Tạm ngưng", type: "bool" }
      ] },
    positions: { title: "Vị trí link", desc: "Mã vị trí đứng đầu utm_content. Vị trí mới dùng hình minh họa “trong bài” của nền tảng; bio và menu là link cố định.",
      key: r => r.code || "", blank: () => ({ code: "", label: "", help: "" }),
      cols: [
        { k: "label", label: "Tên hiển thị", slugTo: "code" },
        { k: "code", label: "Mã", type: "code" },
        { k: "help", label: "Giải thích", wide: true }
      ] },
    landings: { title: "Trang đích", desc: "Trang có sẵn để chọn khi tạo link. Product mặc định được điền tự động khi chọn trang.",
      key: r => r.id, blank: () => ({ id: "", site: "Web chính", label: "", url: "https://www.dsc.com.vn/", product: "" }),
      cols: [
        { k: "id", label: "Mã nội bộ", type: "code" },
        { k: "site", label: "Site", list: () => [...new Set(D.landings.map(l => l.site))] },
        { k: "label", label: "Tên trang" },
        { k: "url", label: "URL", type: "url", wide: true },
        { k: "product", label: "Product mặc định", type: "select", options: () => [["", "—"], ...D.products.map(p => [p.code, p.name])] },
        { k: "state", label: "Trạng thái", type: "select", options: () => [["", "Đang dùng"], ["tam", "Tạm thời"], ["off", "Đã tắt"]] },
        { k: "note", label: "Ghi chú", wide: true }
      ] },
    products: { title: "Sản phẩm", desc: "Giá trị của utm_product.", key: r => r.code, blank: () => ({ group: "", name: "", code: "" }),
      cols: [
        { k: "group", label: "Nhóm", list: () => [...new Set(D.products.map(p => p.group))] },
        { k: "name", label: "Tên sản phẩm", slugTo: "code" },
        { k: "code", label: "Mã", type: "code" }
      ] },
    prefixes: { title: "Loại nội dung", desc: "Tiền tố đứng đầu utm_content (sau vị trí).", key: r => r.code, blank: () => ({ code: "", label: "", help: "" }),
      cols: [
        { k: "label", label: "Tên hiển thị", slugTo: "code" },
        { k: "code", label: "Mã", type: "code" },
        { k: "help", label: "Gợi ý" }
      ] },
    routes: { title: "Gợi ý trang đích theo loại bài", desc: "Trang Tạo link gợi ý trang đích theo thứ tự các dòng. Một loại bài có thể có nhiều dòng.",
      key: r => `${r.prefix}|${r.to}`, blank: () => ({ prefix: "", to: "" }),
      cols: [
        { k: "prefix", label: "Loại nội dung", type: "select", options: () => [["", "Chọn…"], ...D.prefixes.map(p => [p.code, p.label])] },
        { k: "to", label: "Trang đích", type: "select", options: landingOpts }
      ] },
    slots: { title: "Link cố định (kế hoạch)", desc: "Bio, nút CTA, menu của từng kênh. Đổi trang đích ở đây thì phải cài lại link mới trên kênh.",
      key: r => `${r.m}|${r.where}`, blank: () => ({ m: "", pos: "bio", where: "", how: "", to: "" }),
      cols: [
        { k: "m", label: "Tài khoản", type: "select", options: () => [["", "Chọn…"], ...D.accounts.filter(a => !a.paid).map(a => [a.m, `${PLATFORMS[a.p].name} · ${a.name}`])] },
        { k: "pos", label: "Vị trí", type: "select", options: () => [["bio", "bio"], ["menu", "menu"]] },
        { k: "where", label: "Tên vị trí" },
        { k: "how", label: "Cách đặt", wide: true },
        { k: "to", label: "Trang đích", type: "select", options: landingOpts }
      ] },
    campaigns: { title: "Chiến dịch gợi ý", desc: "Tên chiến dịch hiện trong ô gợi ý. Người dùng vẫn gõ được tên mới.", key: r => slug(r.name), blank: () => ({ name: "" }),
      cols: [{ k: "name", label: "Tên chiến dịch", wide: true }] },
    hosts: { title: "Domain hợp lệ", desc: "Link ngoài các domain này sẽ bị cảnh báo khi tạo.", key: r => r.host, blank: () => ({ host: "" }),
      cols: [{ k: "host", label: "Domain", wide: true }] },
    groups: { title: "Kênh (bản đồ hành trình)", desc: "Cột “Thu hút” trên bản đồ: mỗi dòng là một nền tảng. Trang đích ưu tiên dùng khi tài khoản chưa có “Trang đích cho video / tin” riêng.",
      key: r => r.id, blank: () => ({ id: "", name: "", platforms: [], role: "Thu hút", goal: "", cta: "", landings: [], kpi: "" }),
      cols: [
        { k: "name", label: "Tên kênh", slugTo: "id" },
        { k: "id", label: "Mã", type: "code" },
        { k: "platforms", label: "Nền tảng", type: "multi", options: () => PLATFORM_ORDER.filter(p => p !== "other").map(p => [p, PLATFORMS[p].name]) },
        { k: "role", label: "Vai trò", type: "select", options: () => [["Thu hút", "Thu hút"], ["Nuôi dưỡng", "Nuôi dưỡng"], ["Chuyển đổi", "Chuyển đổi"]] },
        { k: "goal", label: "Mục tiêu", wide: true },
        { k: "cta", label: "CTA / vị trí link", wide: true },
        { k: "landings", label: "Trang đích mặc định (link theo video)", type: "multi", options: () => DSC.activeLandings(D).map(l => [l.id, DSC.landingLabel(l)]) },
        { k: "kpi", label: "Chỉ số theo dõi", wide: true }
      ] },
    formats: { title: "Định dạng theo nền tảng", desc: "Video ngắn, video dài, livestream… của từng nền tảng: link đặt ở đâu, nói gì trong video, mẫu utm_content. Hiện ở tab Hướng dẫn theo kênh.",
      key: r => `${r.p}|${r.fmt}|${r.label}`, blank: () => ({ p: "facebook", fmt: "short", label: "", where: "", cta: "", content: "" }),
      cols: [
        { k: "p", label: "Nền tảng", type: "select", options: () => PLATFORM_ORDER.filter(p => p !== "other").map(p => [p, PLATFORMS[p].name]) },
        { k: "fmt", label: "Loại", type: "select", options: () => [["short", "Video ngắn"], ["long", "Video dài"], ["live", "Livestream"], ["msg", "Tin nhắn"], ["ad", "Quảng cáo"]] },
        { k: "label", label: "Tên định dạng" },
        { k: "where", label: "Link đặt ở", wide: true },
        { k: "cta", label: "Nói gì trong video (CTA)", wide: true },
        { k: "content", label: "Mẫu utm_content", wide: true }
      ] },
    hubs: { title: "Nuôi dưỡng (bản đồ hành trình)", desc: "Cột giữa trên bản đồ: nhóm trang làm ấm khách trước khi mở tài khoản. Mỗi nhóm cần một cách đẩy khách sang Mở tài khoản.",
      key: r => r.id, blank: () => ({ id: "", name: "", landings: [], next: "", kpi: "" }),
      cols: [
        { k: "name", label: "Tên nhóm", slugTo: "id" },
        { k: "id", label: "Mã", type: "code" },
        { k: "landings", label: "Trang đích trong nhóm", type: "multi", options: () => D.landings.map(l => [l.id, DSC.landingLabel(l)]) },
        { k: "next", label: "Cách đẩy sang Mở tài khoản", wide: true },
        { k: "kpi", label: "Chỉ số theo dõi", wide: true }
      ] },
    conversions: { title: "Chuyển đổi", desc: "Tích “Đích chính” cho mục tiêu cuối (Mở tài khoản) và chọn trang của nó. Chuyển đổi phụ gắn vào một nhóm Nuôi dưỡng.",
      key: r => r.id, blank: () => ({ id: "", name: "" }),
      cols: [
        { k: "name", label: "Tên chuyển đổi", slugTo: "id" },
        { k: "id", label: "Mã", type: "code" },
        { k: "main", label: "Đích chính", type: "bool" },
        { k: "landing", label: "Trang của đích chính", type: "select", options: () => [["", "—"], ...D.landings.map(l => [l.id, DSC.landingLabel(l)])] },
        { k: "hub", label: "Chuyển đổi phụ thuộc nhóm", type: "select", options: () => [["", "—"], ...D.hubs.map(h => [h.id, h.name])] }
      ] },
    steps: { title: "Bước funnel + event GA4", desc: "Các bước của từng chuyển đổi, theo thứ tự dòng. Điền đúng tên event đã cài trên GA4. Tích “Chính” cho bước chuyển đổi cuối.",
      key: r => `${r.conv}|${r.step}`, blank: () => ({ conv: "", step: "", event: "" }),
      cols: [
        { k: "conv", label: "Chuyển đổi", type: "select", options: () => [["", "Chọn…"], ...D.conversions.map(c => [c.id, c.name])] },
        { k: "step", label: "Bước", wide: true },
        { k: "event", label: "Event GA4", type: "code" },
        { k: "key", label: "Chính", type: "bool" }
      ] }
  };
  function landingOpts() { return [["", "Chọn…"], ...D.landings.map(l => [l.id, `${DSC.landingLabel(l)} (${l.site})${l.state === "off" ? " – đã tắt" : ""}`])]; }

  let cur = (location.hash.slice(1) in SCHEMA) || location.hash === "#io" || location.hash === "#history" ? location.hash.slice(1) : "accounts";
  let work = cur in SCHEMA ? clone(D[cur]) : null, dirty = false;

  // ===== Validation =====
  function validate(key, rows) {
    const S = SCHEMA[key], w = [], seen = {};
    rows.forEach((r, i) => {
      const n = `Dòng ${i + 1}`;
      // Position code "" (in post / message) is valid
      S.cols.filter(c => c.type === "code" && !(key === "positions" && c.k === "code")).forEach(c => { if (!r[c.k]) w.push([i, `${n}: thiếu ${c.label}.`]); });
      const k = S.key(r);
      if (k && seen[k] !== undefined) w.push([i, `${n}: trùng với dòng ${seen[k] + 1}.`]); else seen[k] = i;
      if (key === "accounts" && !r.paid && /cp|ppc|^paid/.test(`${r.m}`)) w.push([i, `${n}: medium organic không được chứa “cp”, “ppc” hoặc bắt đầu bằng “paid”.`]);
      if (key === "accounts" && r.paid && r.m !== "cpc") w.push([i, `${n}: tài khoản trả tiền phải có medium “cpc”.`]);
      if (key === "landings") {
        try { const u = new URL(r.url); if (!D.hosts.some(h => h.host === u.hostname)) w.push([i, `${n}: domain ${u.hostname} không nằm trong Domain hợp lệ.`]); }
        catch (e) { w.push([i, `${n}: URL chưa đúng.`]); }
      }
      if ((key === "routes" || key === "slots") && r.to) {
        const l = D.landings.find(x => x.id === r.to);
        if (!l) w.push([i, `${n}: trang đích “${r.to}” không còn trong danh sách.`]);
        else if (l.state === "off") w.push([i, `${n}: trang đích “${l.label}” đã tắt, cần đổi sang trang khác.`]);
      }
      if (key === "landings" && r.state === "off") w.push([i, `${n}: trang đã tắt. Kiểm tra lại Link cố định và Gợi ý trang đích đang trỏ về trang này.`]);
      if (key === "slots" && r.m && !D.accounts.some(a => a.m === r.m)) w.push([i, `${n}: tài khoản “${r.m}” không còn trong danh sách.`]);
    });
    // Rule 4: never rename codes already in use
    const def = window.DSC_DEFAULTS[key];
    if (["accounts", "products", "prefixes", "landings"].includes(key) && def) {
      const now = new Set(rows.map(S.key));
      def.filter(r => !now.has(S.key(r))).forEach(r => w.push([-1, `Mã “${S.key(r).replace(/^[^|]*\|/, "")}” trong file gốc đã bị xóa hoặc đổi. Đổi mã đã dùng sẽ tách lịch sử GA4 làm đôi.`]));
    }
    return w;
  }

  // ===== Plain-language labels for the list and the form =====
  const platName = p => (PLATFORMS[p] || PLATFORMS.other).name;
  const landName = id => { const l = D.landings.find(x => x.id === id); return l ? DSC.landingLabel(l) : id || "?"; };
  const acctName = m => { const a = D.accounts.find(x => x.m === m); return a ? DSC.accountName(a) : m || "?"; };
  const FMT_NAME = { short: "Video ngắn", long: "Video dài", live: "Livestream", msg: "Tin nhắn", ad: "Quảng cáo" };
  const STATE_NAME = { tam: "Tạm thời", off: "Đã tắt" };
  const ITEM = {
    accounts: { t: r => `${platName(r.p)} · ${r.name || "(chưa đặt tên)"}`, s: r => [r.paid ? "Trả tiền" : "", r.inactive ? "Tạm ngưng" : "", r.sub, r.owner].filter(Boolean).join(" · ") },
    positions: { t: r => r.label || "(chưa đặt tên)", s: r => r.help },
    landings: { t: r => r.label || "(chưa đặt tên)", s: r => [r.site, STATE_NAME[r.state], DSC.displayUrl(r.url)].filter(Boolean).join(" · ") },
    products: { t: r => r.name || "(chưa đặt tên)", s: r => r.group },
    prefixes: { t: r => r.label || "(chưa đặt tên)", s: r => r.help },
    routes: { t: r => `${(D.prefixes.find(x => x.code === r.prefix) || {}).label || r.prefix || "?"} → ${landName(r.to)}`, s: () => "" },
    slots: { t: r => `${acctName(r.m)} · ${r.where || "?"}`, s: r => "→ " + landName(r.to) },
    campaigns: { t: r => r.name || "(chưa đặt tên)", s: () => "" },
    hosts: { t: r => r.host || "(trống)", s: () => "" },
    groups: { t: r => r.name || "(chưa đặt tên)", s: r => r.role },
    formats: { t: r => `${platName(r.p)} · ${r.label || "?"}`, s: r => FMT_NAME[r.fmt] || r.fmt },
    hubs: { t: r => r.name || "(chưa đặt tên)", s: r => `${(r.landings || []).length} trang` },
    conversions: { t: r => r.name || "(chưa đặt tên)", s: r => r.main ? "Đích chính" : "" },
    steps: { t: r => `${(D.conversions.find(c => c.id === r.conv) || {}).name || r.conv || "?"} · ${r.step || "?"}`, s: r => r.event }
  };
  const itemTitle = (k, r) => (ITEM[k] || { t: r => JSON.stringify(r) }).t(r);
  const itemSub = (k, r) => (ITEM[k] || { s: () => "" }).s(r) || "";
  // One-line explanation under each field
  const HELP = {
    accounts: {
      p: "Mạng xã hội hoặc nền tảng quảng cáo.",
      s: "Thường là tên nền tảng: facebook, tiktok, youtube, zalo. Quảng cáo Google ghi google.",
      m: "Mã riêng của tài khoản, ví dụ fanpage_dsc. Quảng cáo luôn là cpc. Đã dùng thì không đổi.",
      name: "Tên mọi người hay gọi, hiện trên nút chọn kênh.", sub: "Ví dụ: @dsc.official, hoặc 1 câu mô tả.",
      owner: "Team phụ trách kênh.", focus: "Kênh này đăng nội dung gì, cho ai.",
      to: "Video / tin của kênh này thường dẫn về đâu. Bỏ trống thì dùng trang mặc định của nền tảng.",
      mode: "Theo kịch bản: môi giới gửi link theo kịch bản chăm sóc, không theo từng video.",
      pos: "Những chỗ kênh này được đặt link.", paid: "Tài khoản chạy quảng cáo trả tiền.", inactive: "Ẩn khỏi bản đồ hành trình, vẫn tạo link được."
    },
    positions: { label: "Tên hiển thị trên nút chọn vị trí.", code: "Đứng đầu utm_content. Để trống nghĩa là “trong bài”.", help: "Giải thích ngắn, hiện dưới nút." },
    landings: {
      id: "Mã nội bộ để các mục khác trỏ tới, không xuất hiện trong link.", site: "Web chính hoặc Tài Chính Số.", label: "Tên trang mọi người hay gọi.",
      url: "Địa chỉ đầy đủ, phải thuộc dsc.com.vn.", product: "Tự điền sản phẩm khi chọn trang này.",
      state: "Tạm thời: hiện cảnh báo khi tạo link. Đã tắt: ẩn khỏi Tạo link và bản đồ.", note: "Ví dụ: sẽ tắt khi Tài Chính Số chuyển xong."
    },
    products: { group: "Nhóm để gom trong ô chọn.", name: "Tên sản phẩm.", code: "Giá trị utm_product. Đã dùng thì không đổi." },
    prefixes: { label: "Tên loại bài.", code: "Đứng đầu utm_content, ví dụ nhan_dinh. Đã dùng thì không đổi.", help: "Ví dụ ngắn, hiện dưới nút." },
    routes: { prefix: "Khi chọn loại bài này…", to: "…trang Tạo link gợi ý trang đích này. Dòng ở trên được gợi ý trước." },
    slots: {
      m: "Tài khoản đặt link cố định.", pos: "bio: trang hồ sơ, nút CTA. menu: menu Zalo OA.", where: "Tên ngắn, ví dụ “Nút CTA”, “Link 1 trang kênh”.",
      how: "Các bước bấm trên nền tảng để dán link.", to: "Link cố định dẫn về trang nào. Đổi trang thì phải cài lại link trên kênh."
    },
    campaigns: { name: "Tên chiến dịch, hiện trong ô gợi ý ở trang Tạo link." },
    hosts: { host: "Tên miền thuộc dsc.com.vn. Link ngoài danh sách sẽ bị cảnh báo." },
    steps: { event: "Đúng tên event đã cài trên GA4.", key: "Bước chuyển đổi cuối cùng." }
  };
  const ADVANCED = ["groups", "formats", "hubs", "conversions", "steps"];

  // ===== Render =====
  function renderNav() {
    const nav = $("catNav"); nav.innerHTML = "";

            "// DSC UTM Builder – default catalog (presets). Exported from Danh mục on " + new Date().toISOString().slice(0, 10) + ".\n" +
            "// Every page reads this file. Edits on \"Danh mục\" are stored per browser; export again to update this file.\n" +
            "window.DSC_DEFAULTS = " + JSON.stringify(snapshot(), null, 2) + ";\n", "text/javascript") }, "Xuất data.js")),
        el("div", { class: "card" }, el("h3", {}, "Gửi cho đồng nghiệp"),
          el("p", {}, DSC.isOnline() ? "Sao lưu hoặc chuyển danh mục. Nhập JSON khi đang dùng Supabase sẽ ghi đè danh mục của cả team." : "Xuất file JSON để người khác nhập vào trình duyệt của họ, không cần sửa repo."),
          el("div", { class: "tbar" },
            el("button", { type: "button", class: "btn ghost", onclick: () => download("dsc-utm-danh-muc.json", JSON.stringify(snapshot(), null, 2), "application/json") }, "Xuất JSON"),
            el("label", { class: "btn ghost" }, "Nhập JSON…", el("input", { type: "file", accept: ".json,application/json", hidden: true, onchange: importJson })))),
        el("div", { class: "card" }, el("h3", {}, "Khôi phục"),
          el("p", {}, D.custom.length ? `Đang có ${D.custom.length} mục đã chỉnh trên trình duyệt này: ${D.custom.map(k => SCHEMA[k].title).join(", ")}.` : DSC.isOnline() ? "Đưa toàn bộ danh mục của cả team về data.js." : "Đang dùng toàn bộ bản gốc từ data.js."),
          el("button", { type: "button", class: "btn ghost danger", disabled: !(D.custom.length || D.shared.length) || null, onclick: async () => {
            if (!confirm(DSC.isOnline() ? "Đưa TOÀN BỘ danh mục của cả team về data.js?" : "Bỏ mọi chỉnh sửa, quay về data.js?")) return;
            await DSC.resetCollection(); D = DSC.loadData(); render(); } }, "Về bản gốc toàn bộ"))));
  }
  function importJson(e) {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(async t => {
      let o; try { o = JSON.parse(t); } catch (err) { toast("File không đúng định dạng JSON."); return; }
      const keys = DSC.COLLECTIONS.filter(k => Array.isArray(o[k]));
      if (DSC.isOnline() && !confirm(`Ghi đè ${keys.length} mục danh mục cho CẢ TEAM bằng file này?`)) return;
      const res = await Promise.all(keys.map(k => DSC.saveCollection(k, o[k])));
      D = DSC.loadData(); render(); toast(`Đã nhập ${res.filter(Boolean).length}/${keys.length} mục.`);
    });
  }

  // ===== Supabase: status + one-time upload of this browser's catalog and link history =====
  function renderShared() {
    const st = DSC.state.mode;
    const box = el("div", { class: "io" });
    box.append(el("div", { class: "card" }, el("h3", {}, "Trạng thái"),
      el("p", {}, st === "online" ? `Đã kết nối. ${D.shared.length}/${DSC.COLLECTIONS.length} mục danh mục đang dùng chung.`
        : st === "cache" ? `Mất kết nối (${DSC.state.error}). Đang dùng bản tải lần trước.` : `Không kết nối được (${DSC.state.error || "chưa rõ lỗi"}). Kiểm tra assets/config.js.`),
      D.shared.length < DSC.COLLECTIONS.length && st === "online"
        ? el("p", {}, "Mục chưa có trên Supabase vẫn dùng data.js; lưu một lần ở Danh mục hoặc bấm “Đưa lên” để chia sẻ.") : null));
    const local = DSC.localOverrides(), nLocal = Object.keys(local).length;
    const hist = DSC.loadHist();
    let shortN = 0; try { shortN = Object.keys(JSON.parse(localStorage.getItem("dsc_utm_short_v1") || "{}")).length; } catch (e) {}
    box.append(el("div", { class: "card" }, el("h3", {}, "Đưa dữ liệu trình duyệt này lên"),
      el("p", {}, `Danh mục: data.js${nLocal ? ` + ${nLocal} mục đã chỉnh trên trình duyệt này` : ""}. Lịch sử: ${hist.length} link, ${shortN} link rút gọn. Làm một lần khi bắt đầu dùng Supabase.`),
      el("button", { type: "button", class: "btn", disabled: st !== "online" || null, onclick: uploadAll }, "Đưa lên Supabase")));
    return box;
  }
  async function uploadAll(e) {
    const btn = e.currentTarget;
    if (D.shared.length && !confirm(`Supabase đã có ${D.shared.length} mục danh mục. Ghi đè bằng bản trên trình duyệt này? (Bản cũ vẫn khôi phục được trong lịch sử Supabase.)`)) return;
    btn.disabled = true; btn.textContent = "Đang đưa lên…";
    const L = DSC.loadData({ local: true });
    const res = await Promise.all(DSC.COLLECTIONS.map(k => DSC.saveCollection(k, L[k] || [])));
    let shorts = {}; try { shorts = JSON.parse(localStorage.getItem("dsc_utm_short_v1") || "{}"); } catch (err) {}
    const items = new Map();
    DSC.loadHist().forEach(h => items.set(h.url, { url: h.url, label: h.label }));
    Object.entries(shorts).forEach(([url, short_url]) => items.set(url, Object.assign(items.get(url) || { url }, { short_url })));
    let n = 0;
    for (const it of items.values()) { if (await DSC.saveLink(it, true)) n++; }
    D = DSC.loadData(); render();
    toast(`Đã đưa lên ${res.filter(Boolean).length}/${DSC.COLLECTIONS.length} mục danh mục và ${n}/${items.size} link` + (n < items.size ? " (link ngoài dsc.com.vn được bỏ qua)." : "."), 5000);
  }
  document.addEventListener("dsc-save-failed", () => { D = DSC.loadData(); });
  function toast(t) { const x = el("div", { class: "toast", role: "status" }, t); document.body.append(x); setTimeout(() => x.remove(), 2600); }

  addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
  render();
});
</script>
</body>
</html>
