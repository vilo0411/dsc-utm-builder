<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kho link · DSC UTM Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page wide">
  <div class="page-h">
    <div>
      <h1>Kho link</h1>
      <p>Mọi link cả team đã tạo, copy hoặc rút gọn. Lọc theo kênh, chiến dịch, trang đích. Ghi lại link đang đặt ở đâu, và đánh dấu link cần thay khi trang đích đổi.</p>
    </div>
    <a class="btn" href="index.html">+ Tạo link mới</a>
  </div>

  <div id="offline" class="callout warn" hidden></div>
  <ul class="alerts" id="alerts"></ul>

  <div class="lib-bar" id="bar" hidden>
    <input type="search" id="q" placeholder="Tìm theo tiêu đề, link, ghi chú, nơi đặt…" aria-label="Tìm link">
    <div class="flt" id="fKind" role="group" aria-label="Loại link"></div>
    <div class="flt" id="fStatus" role="group" aria-label="Trạng thái"></div>
    <div class="lib-sel">
      <select id="fPlat" aria-label="Nền tảng"></select>
      <select id="fAcct" aria-label="Tài khoản"></select>
      <select id="fCamp" aria-label="Chiến dịch"></select>
      <select id="fLand" aria-label="Trang đích"></select>
      <select id="fBy" aria-label="Người tạo"></select>
    </div>
    <div class="lib-sum">
      <div class="flt lib-views" id="fView" role="group" aria-label="Chế độ xem"></div>
      <span id="count" class="hint"></span>
      <span class="grow"></span>
      <button type="button" class="btn ghost sm" id="reset">Bỏ lọc</button>
      <button type="button" class="btn ghost sm" id="csv">Tải CSV</button>
    </div>
  </div>

  <div class="slots lib" id="list"></div>
  <p class="lib-more" id="moreWrap" hidden><button type="button" class="btn ghost" id="more">Xem thêm</button></p>
</div>

<script src="assets/data.js"></script>
<script src="assets/config.js"></script>
<script src="assets/common.js"></script>
<script src="assets/mockups.js"></script>
<script>
// Wait for the shared catalog (Supabase) before reading it
DSC.ready().then(function () {
  "use strict";
  const { $, el, icon, PLATFORMS, PLATFORM_ORDER, displayUrl, toast } = DSC;
  DSC.renderNav("library");
  const D = DSC.loadData();

  const STATUS = { active: "Đang dùng", replace: "Cần thay", retired: "Ngưng dùng" };
  const KIND = { post: "Theo bài", fixed: "Cố định" };
  const PAGE = 120;
  let links = [], shown = PAGE;
  const f = { q: "", kind: "", status: "", plat: "", acct: "", camp: "", land: "", by: "" };
  const peeks = new Set();

  const qs = new URLSearchParams(location.search);
  ["kind", "status", "plat", "acct", "camp", "land", "by", "q"].forEach(k => { if (qs.get(k)) f[k] = qs.get(k); });

  // View modes; the last one used is remembered on this browser
  // Layouts (grouping is done with the filters above): compact list, sortable table, detailed cards per channel
  const VIEWS = [["list", "Danh sách gọn"], ["table", "Bảng"], ["card", "Thẻ chi tiết"]];
  const VKEY = "dsc_utm_lib_view";
  let view = qs.get("view") || (() => { try { return localStorage.getItem(VKEY); } catch (e) { return ""; } })() || "list";
  if (!VIEWS.some(v => v[0] === view)) view = "list";
  const openRows = new Set();   // compact list: rows expanded to full detail
  let sortK = "date", sortDir = -1;

  if (!DSC.isOnline()) {
    const box = $("offline"); box.hidden = false;
    box.append(DSC.configured()
      ? `Không kết nối được Supabase (${DSC.state.error || "lỗi mạng"}). Kho link cần kết nối để xem link của cả team.`
      : "Kho link cần dữ liệu dùng chung. Chưa cấu hình Supabase trong assets/config.js (xem supabase/README.md). Dưới đây là các link vừa tạo trên trình duyệt này.");
    renderLocal();
    return;
  }

  // ===== Helpers =====
  const acctOf = l => DSC.account(D, l.account_m || l.medium, l.source) || DSC.account(D, l.account_m || l.medium);
  const platOf = l => { const a = acctOf(l); return a ? a.p : (PLATFORMS[l.source] ? l.source : "other"); };
  const landOf = l => l.landing_id ? DSC.landing(D, l.landing_id) : null;
  function base(u) { try { const x = new URL(u); return (x.hostname.toLowerCase().replace(/^www\./, "") + x.pathname).replace(/\/+$/, ""); } catch (e) { return ""; } }
  function fmtDate(t) { try { return new Date(t).toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric" }); } catch (e) { return ""; } }
  // Planned fixed slot behind a fixed link (account + slot name)
  const slotOf = l => l.kind === "fixed" ? D.slots.find(s => s.m === l.account_m && s.where === l.title) : null;
  const isSlotLink = l => l.kind === "fixed" && l.fields && l.fields.slot;
  // Why an active link needs attention (empty when fine)
  function problem(l) {
    if (l.status === "replace") return isSlotLink(l) && slotOf(l) ? "Kế hoạch đã đổi link này, cần cài link mới trên kênh." : "Đã đánh dấu cần thay.";
    if (l.status !== "active") return "";
    if (isSlotLink(l) && !slotOf(l)) return "Link cố định không còn trong kế hoạch.";
    const lp = landOf(l);
    if (l.landing_id && !lp) return "Trang đích không còn trong Danh mục.";
    if (lp && lp.state === "off") return `Trang đích “${lp.label}” đã tắt.`;
    if (lp && base(l.url) && base(lp.url) && base(l.url) !== base(lp.url)) return `Trang đích “${lp.label}” đã đổi địa chỉ.`;
    if (lp && lp.state === "tam") return `Trang tạm: ${lp.note || "sẽ tắt trong thời gian tới"}.`;
    return "";
  }
  const acctLabel = l => { const a = acctOf(l); return a ? DSC.accountName(a) : [l.source, l.medium].filter(Boolean).join(" · ") || "Chưa rõ kênh"; };

  // ===== Load =====
  async function load() {
    try { await DSC.syncFixedLinks(D); } catch (e) { /* the list below still loads */ }
    try { links = await DSC.listLinks(); }
    catch (e) { $("offline").hidden = false; $("offline").textContent = "Không tải được Kho link: " + e.message; return; }
    $("bar").hidden = false;
    fillFilters(); render();
  }

  function opt(sel, label, entries, val) {
    sel.innerHTML = "";
    sel.append(el("option", { value: "" }, label));
    entries.forEach(([v, t]) => sel.append(el("option", { value: v }, t)));
    sel.value = val; if (sel.value !== val) sel.value = "";
  }
  function fillFilters() {
    const chips = (box, key, items) => {
      box.innerHTML = "";
      items.forEach(([v, t]) => box.append(el("button", { type: "button", class: "chip", "aria-pressed": String(f[key] === v),
        onclick: () => { f[key] = v; shown = PAGE; fillFilters(); render(); } }, t)));
    };
    chips($("fKind"), "kind", [["", "Mọi loại"], ["post", "Theo bài"], ["fixed", "Cố định (bio, menu)"]]);
    chips($("fStatus"), "status", [["", "Mọi trạng thái"], ["active", "Đang dùng"], ["attn", "Cần xử lý"], ["replace", "Cần thay"], ["retired", "Ngưng dùng"]]);
    const uniq = arr => [...new Set(arr.filter(Boolean))];
    opt($("fPlat"), "Mọi nền tảng", PLATFORM_ORDER.filter(p => links.some(l => platOf(l) === p)).map(p => [p, PLATFORMS[p].name]), f.plat);
    const accts = new Map(); links.filter(l => !f.plat || platOf(l) === f.plat).forEach(l => accts.set(l.account_m || l.medium || "", acctLabel(l)));
    opt($("fAcct"), "Mọi tài khoản", [...accts].filter(([k]) => k).sort((a, b) => a[1].localeCompare(b[1], "vi")), f.acct);
    opt($("fCamp"), "Mọi chiến dịch", uniq(links.map(l => l.campaign)).sort().map(c => [c, c]), f.camp);
    opt($("fLand"), "Mọi trang đích", uniq(links.map(l => l.landing_id)).map(id => [id, DSC.landingLabel(DSC.landing(D, id)) || id]), f.land);
    opt($("fBy"), "Mọi người tạo", uniq(links.map(l => l.created_by)).sort().map(b => [b, b === DSC.me() ? `${b} (bạn)` : b]), f.by);
    $("q").value = f.q;
  }
  [["fPlat", "plat"], ["fAcct", "acct"], ["fCamp", "camp"], ["fLand", "land"], ["fBy", "by"]].forEach(([id, k]) =>
    $(id).addEventListener("change", e => { f[k] = e.target.value; if (k === "plat") f.acct = ""; shown = PAGE; fillFilters(); render(); }));
  let qt; $("q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { f.q = e.target.value; shown = PAGE; render(); }, 150); });
  $("reset").addEventListener("click", () => { Object.keys(f).forEach(k => f[k] = ""); shown = PAGE; fillFilters(); render(); });
  $("more").addEventListener("click", () => { shown += PAGE; render(); });

  function filtered() {
    const q = DSC.slug(f.q);
    return links.filter(l =>
      (!f.kind || l.kind === f.kind) &&
      (!f.status || (f.status === "attn" ? !!problem(l) : l.status === f.status)) &&
      (!f.plat || platOf(l) === f.plat) &&
      (!f.acct || (l.account_m || l.medium) === f.acct) &&
      (!f.camp || l.campaign === f.camp) &&
      (!f.land || l.landing_id === f.land) &&
      (!f.by || l.created_by === f.by) &&
      (!q || DSC.slug([l.label, l.title, l.url, l.short_url, l.note, l.placed_at, l.campaign].join(" ")).includes(q)));
  }

  // ===== Alerts: links that need attention =====
  function renderAlerts() {
    const ul = $("alerts"); ul.innerHTML = "";
    const bad = links.filter(problem);
    if (!bad.length) return;
    const fixedN = bad.filter(l => l.kind === "fixed").length;
    ul.append(el("li", {}, el("b", {}, `${bad.length} link cần xử lý`),
      fixedN ? ` (${fixedN} link cố định phải cài lại trên kênh)` : "",
      ": trang đích đã tắt, đổi địa chỉ, là trang tạm, hoặc đã đánh dấu cần thay. ",
      f.status === "attn" ? null : el("button", { type: "button", class: "qe-link", onclick: () => { f.status = "attn"; shown = PAGE; fillFilters(); render(); } }, "Xem các link này")));
  }

  // ===== List =====
  function renderViews() {
    const box = $("fView"); box.innerHTML = "";
    box.append(el("span", { class: "lib-vl" }, "Xem:"));
    VIEWS.forEach(([v, t]) => box.append(el("button", { type: "button", class: "chip", "aria-pressed": String(view === v),
      onclick: () => { view = v; shown = PAGE; try { localStorage.setItem(VKEY, v); } catch (e) {} render(); } }, t)));
  }

  function statusCounts(list) {
    const n = st => list.filter(l => l.status === st).length;
    return [n("replace") ? `${n("replace")} cần thay` : "", n("retired") ? `${n("retired")} ngưng` : ""].filter(Boolean).join(" · ");
  }

  function render() {
    renderAlerts(); renderViews();
    const rows = filtered();
    $("count").textContent = `${rows.length} / ${links.length} link`;
    const box = $("list"); box.innerHTML = "";
    box.className = view === "table" ? "lib-tbl-wrap" : view === "list" ? "lib-ul" : "slots lib";
    if (!links.length) {
      box.append(el("p", { class: "hint" }, "Chưa có link nào. Link được lưu vào đây khi bạn bấm Copy hoặc Rút gọn ở trang Tạo link, Kế hoạch."));
      $("moreWrap").hidden = true; return;
    }
    if (!rows.length) { box.append(el("p", { class: "hint" }, "Không có link nào khớp bộ lọc.")); $("moreWrap").hidden = true; return; }
    $("moreWrap").hidden = rows.length <= shown;
    if (view === "table") return renderTable(box, rows);
    if (view === "list") return renderCompact(box, rows);
    // Detailed cards, one card per channel
    const groups = new Map();
    rows.slice(0, shown).forEach(l => { const k = l.account_m || l.medium || "?"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(l); });
    groups.forEach(list => {
      const l0 = list[0], p = platOf(l0), a = acctOf(l0);
      const card = el("article", { class: "card acard", style: { "--c": (PLATFORMS[p] || PLATFORMS.other).color } },
        el("div", { class: "acard-h" }, icon(p), el("b", {}, acctLabel(l0)),
          el("small", {}, [a && a.owner, `${list.length} link`, statusCounts(list)].filter(Boolean).join(" · "))));
      list.forEach(l => card.append(row(l, a)));
      box.append(card);
    });
  }

  // ===== Compact list: one line per link, click to expand the full detail =====
  function renderCompact(box, rows) {
    rows.slice(0, shown).forEach(l => {
      const p = platOf(l), lp = landOf(l), short = l.short_url || DSC.cachedShort(l.url), warn = problem(l), open = openRows.has(l.id);
      const toggle = () => { open ? openRows.delete(l.id) : openRows.add(l.id); render(); };
      box.append(el("div", { class: "lib-li" + (open ? " open" : "") + (l.status === "retired" ? " off" : "") + (warn ? " warn" : ""), style: { "--c": (PLATFORMS[p] || PLATFORMS.other).color } },
        el("div", { class: "lib-li-h" },
          el("button", { type: "button", class: "lib-li-main", "aria-expanded": String(open), title: open ? "Thu gọn" : "Xem chi tiết", onclick: toggle },
            el("span", { class: "lib-li-ico" }, icon(p)),
            el("span", { class: "lib-li-t" },
              el("b", {}, l.title || l.label || displayUrl(l.url), l.kind === "fixed" ? el("span", { class: "tag fix" }, "Cố định") : null),
              el("small", {}, [acctLabel(l), lp ? "→ " + DSC.landingLabel(lp) : "", l.campaign, [l.created_by, fmtDate(l.created_at)].filter(Boolean).join(", ")].filter(Boolean).join(" · "))),
            el("span", { class: "lib-li-url", title: l.url }, short ? short.replace(/^https?:\/\//, "") : displayUrl(l.url)),
            el("span", { class: "lib-badge s-" + l.status }, warn && l.status === "active" ? "Cần xử lý" : STATUS[l.status]),
            el("span", { class: "lib-li-car", "aria-hidden": "true" }, open ? "▾" : "▸")),
          el("button", { type: "button", class: "btn sm", onclick: e => DSC.copyText(short || l.url, e.currentTarget) }, short ? "Copy ngắn" : "Copy")),
        open ? row(l, acctOf(l)) : null));
    });
  }

  // ===== Table view: one line per link, sortable =====
  const COLS = [
    ["title", "Tiêu đề", l => (l.title || l.label || "").toLowerCase()],
    ["acct", "Kênh", l => acctLabel(l).toLowerCase()],
    ["land", "Trang đích", l => (DSC.landingLabel(landOf(l)) || l.url).toLowerCase()],
    ["camp", "Chiến dịch", l => (l.campaign || "").toLowerCase()],
    ["status", "Trạng thái", l => ({ replace: 0, active: 1, retired: 2 })[l.status]],
    ["by", "Người tạo", l => (l.created_by || "").toLowerCase()],
    ["date", "Ngày tạo", l => l.created_at || ""],
    ["placed", "Đặt ở", l => (l.placed_at || "").toLowerCase()]
  ];
  function renderTable(box, rows) {
    const col = COLS.find(c => c[0] === sortK) || COLS[6];
    const sorted = rows.slice().sort((a, b) => { const x = col[2](a), y = col[2](b); return (x < y ? -1 : x > y ? 1 : 0) * sortDir; });
    const th = ([k, t]) => el("th", { "aria-sort": sortK === k ? (sortDir > 0 ? "ascending" : "descending") : null },
      el("button", { type: "button", onclick: () => { if (sortK === k) sortDir = -sortDir; else { sortK = k; sortDir = k === "date" ? -1 : 1; } render(); } },
        t, sortK === k ? (sortDir > 0 ? " ▲" : " ▼") : ""));
    const tb = el("tbody");
    sorted.slice(0, shown).forEach(l => {
      const lp = landOf(l), short = l.short_url || DSC.cachedShort(l.url), warn = problem(l), p = platOf(l);
      const st = el("select", { class: "lib-status s-" + l.status, "aria-label": "Trạng thái", onchange: e => patch(l, { status: e.target.value }) },
        Object.entries(STATUS).map(([v, t]) => el("option", { value: v }, t)));
      st.value = l.status;
      tb.append(el("tr", { class: (l.status === "retired" ? "off " : "") + (warn ? "warn" : "") },
        el("td", { class: "t" }, el("b", {}, l.title || l.label || displayUrl(l.url)), " ",
          el("span", { class: "tag" + (l.kind === "fixed" ? " fix" : "") }, KIND[l.kind] || l.kind),
          warn ? el("div", { class: "warnline" }, warn) : null,
          el("div", { class: "lk", title: l.url }, short ? short.replace(/^https?:\/\//, "") : displayUrl(l.url))),
        el("td", {}, el("span", { class: "lib-ch", style: { "--c": (PLATFORMS[p] || PLATFORMS.other).color } }, icon(p), acctLabel(l))),
        el("td", {}, lp ? DSC.landingLabel(lp) : displayUrl((l.url || "").split("?")[0])),
        el("td", {}, l.campaign || el("span", { class: "hint" }, "—")),
        el("td", {}, st),
        el("td", {}, l.created_by || ""),
        el("td", { class: "nw" }, fmtDate(l.created_at)),
        el("td", { class: "placed" }, l.placed_at ? (/^https?:\/\//.test(l.placed_at) ? el("a", { href: l.placed_at, target: "_blank", rel: "noopener" }, "Mở ↗") : l.placed_at) : el("span", { class: "hint" }, "—")),
        el("td", { class: "nw" },
          el("button", { type: "button", class: "btn sm", onclick: e => DSC.copyText(short || l.url, e.currentTarget) }, short ? "Copy ngắn" : "Copy"), " ",
          el("a", { class: "qe-link", href: "index.html?from=" + encodeURIComponent(l.id) }, "Tạo tương tự"))));
    });
    box.append(el("table", { class: "lib-tbl" }, el("thead", {}, el("tr", {}, COLS.map(th), el("th", {}))), tb));
  }

  function row(l, a) {
    const lp = landOf(l), short = l.short_url || DSC.cachedShort(l.url), warn = problem(l), open = peeks.has(l.id);
    const statusSel = el("select", { class: "lib-status s-" + l.status, "aria-label": "Trạng thái link",
      onchange: e => patch(l, { status: e.target.value }) }, Object.entries(STATUS).map(([v, t]) => el("option", { value: v }, t)));
    statusSel.value = l.status;
    const placed = el("input", { type: "text", class: "lib-placed", value: l.placed_at || "", placeholder: "Đã đặt ở đâu? Dán link bài đăng hoặc ghi “Bio TikTok”…",
      "aria-label": "Nơi đã đặt link", onchange: e => patch(l, { placed_at: e.target.value.trim() || null }) });
    return el("div", { class: "sl nocheck lib-row" + (l.status === "retired" ? " off" : "") },
      el("div", {},
        el("div", { class: "t" }, l.title || l.label || displayUrl(l.url), " ",
          el("span", { class: "tag" + (l.kind === "fixed" ? " fix" : "") }, KIND[l.kind] || l.kind)),
        view !== "card" ? el("div", { class: "how" }, el("span", { class: "lib-ch", style: { "--c": (PLATFORMS[platOf(l)] || PLATFORMS.other).color } }, icon(platOf(l)), acctLabel(l))) : null,
        el("div", { class: "how" }, [
          lp ? "→ " + DSC.landingLabel(lp) : l.url ? "→ " + displayUrl(l.url.split("?")[0]) : "",
          l.campaign ? "Chiến dịch: " + l.campaign : "",
          l.product && (!lp || DSC.productName(D, l.product) !== lp.label) ? DSC.productName(D, l.product) : "",
          [l.created_by, fmtDate(l.created_at)].filter(Boolean).join(", ")
        ].filter(Boolean).join(" · ")),
        reinstall(l) || (warn ? el("div", { class: "how warnline" }, warn, " ",
          el("a", { href: "index.html?from=" + encodeURIComponent(l.id) }, l.kind === "fixed" ? "Tạo link mới để cài lại" : "Tạo link thay thế")) : null),
        short ? el("div", { class: "lk s" }, short.replace(/^https?:\/\//, "")) : null,
        el("div", { class: "lk" }, l.url),
        el("div", { class: "lib-edit" }, placed, statusSel),
        l.note ? el("div", { class: "how" }, "Ghi chú: ", l.note) : null,
        el("div", { class: "lib-acts" },
          el("a", { class: "qe-link", href: "index.html?from=" + encodeURIComponent(l.id), title: "Mở trang Tạo link với các lựa chọn của link này" }, "Tạo tương tự"),
          isSlotLink(l) && slotOf(l) ? el("a", { class: "qe-link", href: "danh-muc.html?k=" + encodeURIComponent(`${l.account_m}|${l.title}`) + "#slots", title: "Đổi trang đích hoặc cách đặt của link cố định này" }, "Sửa trong kế hoạch") : null,
          el("button", { type: "button", class: "qe-link", "aria-expanded": String(open), onclick: () => { open ? peeks.delete(l.id) : peeks.add(l.id); render(); } }, open ? "Ẩn hình" : "Xem vị trí"),
          el("button", { type: "button", class: "qe-link", onclick: () => { const n = prompt("Ghi chú cho link này:", l.note || ""); if (n !== null) patch(l, { note: n.trim() || null }); } }, l.note ? "Sửa ghi chú" : "Ghi chú"),
          el("button", { type: "button", class: "qe-link danger", onclick: () => { if (confirm("Xóa link này khỏi Kho link? (Link vẫn hoạt động nếu đã đăng.)")) patch(l, { deleted_at: new Date().toISOString() }); } }, "Xóa")),
        open ? el("div", { class: "peek" }, el("div", { class: "peekbox" }, el("div", { class: "phone" },
          el("div", { class: "phone-scr", html: Mockup.render(platOf(l), l.position || "", { name: a ? a.name : acctLabel(l), where: l.kind === "fixed" ? l.title : "",
            url: short ? short.replace(/^https?:\/\//, "") : displayUrl(l.url), source: l.source, handle: a && a.sub && a.sub.startsWith("@") ? a.sub.slice(1) : "" }) })))) : null),
      el("div", { class: "btns" },
        el("button", { type: "button", class: "btn sm", onclick: e => DSC.copyText(short || l.url, e.currentTarget) }, short ? "Copy ngắn" : "Copy"),
        short ? el("button", { type: "button", class: "btn ghost sm", onclick: e => DSC.copyText(l.url, e.currentTarget) }, "Copy dài")
          : el("button", { type: "button", class: "btn ghost sm", onclick: e => doShorten(l, e.currentTarget) }, "Rút gọn")));
  }

  // A planned fixed link that changed: show the new link and how to install it, then "Đã cài xong"
  function reinstall(l) {
    const s = isSlotLink(l) && l.status === "replace" ? slotOf(l) : null;
    if (!s) return null;
    const url = DSC.slotUrl(D, s), nl = links.find(x => x.url === url), short = (nl && nl.short_url) || DSC.cachedShort(url);
    return el("div", { class: "reinst" },
      el("b", {}, "Cần cài lại trên kênh"),
      el("div", { class: "how" }, "Cách đặt: ", s.how),
      el("div", { class: "how" }, "Link mới → ", DSC.landingLabel(DSC.landing(D, s.to))),
      el("div", { class: "lk s" }, (short || url).replace(/^https?:\/\//, "")),
      el("div", { class: "reinst-b" },
        el("button", { type: "button", class: "btn sm", onclick: e => DSC.copyText(short || url, e.currentTarget) }, short ? "Copy link mới (ngắn)" : "Copy link mới"),
        short ? null : el("button", { type: "button", class: "btn ghost sm", onclick: async e => { e.currentTarget.disabled = true; try { await DSC.shorten(url); links = await DSC.listLinks(); } catch (err) {} render(); } }, "Rút gọn"),
        el("button", { type: "button", class: "btn ghost sm", onclick: () => patch(l, { status: "retired" }, "Đã ghi nhận: link cũ ngưng dùng.") }, "Đã cài xong")));
  }

  async function patch(l, p, msg) {
    try {
      const r = await DSC.updateLink(l.id, p);
      if (p.deleted_at) links = links.filter(x => x.id !== l.id);
      else Object.assign(l, r || p);
      toast(msg || (p.deleted_at ? "Đã xóa khỏi Kho link." : "Đã lưu."));
    } catch (e) { toast("Không lưu được: " + e.message, 4000); }
    fillFilters(); render();
  }
  async function doShorten(l, btn) {
    btn.disabled = true; btn.textContent = "…";
    try { l.short_url = await DSC.shorten(l.url); render(); }
    catch (e) { btn.disabled = false; btn.textContent = "Lỗi, thử lại"; }
  }

  // ===== CSV (opens in Excel with Vietnamese intact) =====
  $("csv").addEventListener("click", () => {
    const cols = [["created_at", "Ngày tạo"], ["created_by", "Người tạo"], ["title", "Tiêu đề"], ["kind", "Loại"], ["status", "Trạng thái"],
      ["account", "Kênh"], ["landing", "Trang đích"], ["placed_at", "Đặt ở"], ["short_url", "Link rút gọn"], ["url", "Link đầy đủ"],
      ["source", "utm_source"], ["medium", "utm_medium"], ["campaign", "utm_campaign"], ["content", "utm_content"], ["product", "utm_product"], ["note", "Ghi chú"]];
    const val = (l, k) => k === "account" ? acctLabel(l) : k === "landing" ? DSC.landingLabel(landOf(l)) : k === "kind" ? KIND[l.kind] : k === "status" ? STATUS[l.status]
      : k === "created_at" ? fmtDate(l.created_at) : k === "title" ? (l.title || l.label) : l[k];
    const esc = v => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const lines = [cols.map(c => c[1]).join(",")].concat(filtered().map(l => cols.map(([k]) => esc(val(l, k))).join(",")));
    const a = el("a", { href: URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], { type: "text/csv" })), download: `kho-link-${new Date().toISOString().slice(0, 10)}.csv` });
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  });

  // ===== Offline: this browser's recent links only =====
  function renderLocal() {
    const box = $("list"); box.innerHTML = "";
    const h = DSC.loadHist();
    if (!h.length) { box.append(el("p", { class: "hint" }, "Chưa có link nào trên trình duyệt này.")); return; }
    const card = el("article", { class: "card acard" }, el("div", { class: "acard-h" }, el("b", {}, "Link vừa tạo trên trình duyệt này"), el("small", {}, `${h.length} link`)));
    h.forEach(item => {
      const s = DSC.cachedShort(item.url);
      card.append(el("div", { class: "sl nocheck" },
        el("div", {}, el("div", { class: "t" }, item.label), s ? el("div", { class: "lk s" }, s.replace(/^https?:\/\//, "")) : null, el("div", { class: "lk" }, item.url)),
        el("div", { class: "btns" }, el("button", { type: "button", class: "btn sm", onclick: e => DSC.copyText(s || item.url, e.currentTarget) }, s ? "Copy ngắn" : "Copy"))));
    });
    box.append(card);
  }

  load();
});
</script>
</body>
</html>
